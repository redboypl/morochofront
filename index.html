<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundial 2026 — Fase de Grupos | Apuestas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

</head>
<body>
 
<!-- ══ AUTH SCREEN ══ -->
<div id="authScreen">
  <div class="auth-card">
    <h2>Mundial 2026 🏆</h2>
    <p class="subtitle">Registra y guarda tus apuestas</p>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
    </div>
    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="tu@email.com" /></div>
      <div class="form-group"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="••••••••" /></div>
      <button class="btn-primary" id="btnLogin" onclick="login()">Entrar</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="form-group"><label>Nombre de usuario</label><input type="text" id="regUsername" placeholder="Tu nombre" /></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="tu@email.com" /></div>
      <div class="form-group"><label>Contraseña (mín. 8 caracteres)</label><input type="password" id="regPassword" placeholder="••••••••" /></div>
      <button class="btn-primary" id="btnRegister" onclick="register()">Crear cuenta</button>
    </div>
    <p class="auth-error" id="authError"></p>
  </div>
</div>
 
<!-- ══ APP SCREEN ══ -->
<div id="appScreen">
  <header>
    <div class="header-left">
      <h1>Copa del Mundo 2026 — Fase de Grupos</h1>
      <p>Haz clic en un tipo de apuesta para registrarla · Hora Venezuela (VET)</p>
    </div>
    <div class="header-right">
      <span class="user-badge" id="userBadge">—</span>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
 
  <!-- Banner de estado de cuotas -->
  <div class="odds-banner" id="oddsBanner" style="display:none">
    <span><span class="dot-stale" id="oddsDot"></span> <span id="oddsStatus">Cargando cuotas...</span></span>
    <button class="btn-refresh" id="btnRefreshOdds" onclick="loadOdds(true)">↻ Actualizar cuotas</button>
  </div>

  <!-- Nav tabs -->
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('partidos')">Partidos</button>
    <button class="nav-tab" id="tabMisApuestas" onclick="switchView('misApuestas')">Mis Apuestas <span class="badge" id="betsBadge" style="display:none">0</span></button>
  </div>

  <!-- Vista: Mis Apuestas -->
  <div id="misApuestasView">
    <div class="bets-summary" id="betsSummary"></div>
    <div class="bets-list" id="betsList"></div>
  </div>
 
  <div class="controls">
    <label>Grupo</label>
    <select id="filterGroup">
      <option value="">Todos</option>
      <option>A</option><option>B</option><option>C</option><option>D</option>
      <option>E</option><option>F</option><option>G</option><option>H</option>
      <option>I</option><option>J</option><option>K</option><option>L</option>
    </select>
    <label>Fecha</label>
    <select id="filterDate"><option value="">Todas</option></select>
    <input type="text" id="searchTeam" placeholder="Buscar selección..." />
  </div>
 
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Gr.</th>
          <th>Partido</th>
          <th>Hora VET</th>
          <th>Sede</th>
          <th>Apuestas y cuotas</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="no-results" id="noResults">No se encontraron partidos.</div>
  </div>
  <p class="footer-bar" id="countLabel"></p>
</div>
 
<!-- ══ MODAL DE APUESTA ══ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Registrar apuesta</h3>
    <p class="modal-sub" id="modalSub"></p>
    <div id="modalOddsInfo" style="margin-bottom:1rem; padding:10px 12px; background:var(--bg); border-radius:8px; font-size:0.8rem; color:var(--muted); display:none"></div>
    <div class="form-group">
      <label>Monto apostado (USD $)</label>
      <input type="number" id="modalAmount" placeholder="ej: 10.00" min="0" step="0.01" />
    </div>
    <div class="form-group">
      <label>Tu predicción</label>
      <input type="text" id="modalPrediction" placeholder="ej: Local, Empate, Más de 2.5..." />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-delete" id="btnDeleteBet" onclick="deleteBet()" style="display:none">Eliminar</button>
      <button class="btn-save" onclick="saveBet()">Guardar</button>
    </div>
    <p class="auth-error" id="modalError"></p>
  </div>
</div>
 
<div class="toast" id="toast"></div>
 
</body>
</html>
