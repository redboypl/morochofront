<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundial 2026 — Fase de Grupos | Apuestas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── ODDS EXTRAS ── */
    .odds-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }
    .odd-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 500;
      background: #f0f0ec;
      border: 1px solid #ddddd6;
      color: var(--muted);
      white-space: nowrap;
    }
    .odd-pill .odd-label { color: var(--muted); font-size: 0.65rem; }
    .odd-pill .odd-val   { color: var(--text);  font-weight: 600; font-family: 'DM Mono', monospace; }
    .odd-pill.home-pill  { background: #e8f4fd; border-color: #b8d8f5; }
    .odd-pill.draw-pill  { background: #fef9e7; border-color: #f5e6a3; }
    .odd-pill.away-pill  { background: #fdf0f0; border-color: #f5c6c6; }
    .odd-pill.over-pill  { background: var(--green-bg); border-color: var(--green-border); }
    .odd-pill.under-pill { background: var(--amber-bg); border-color: var(--amber-border); }
    .odd-pill.btts-yes   { background: var(--purple-bg); border-color: var(--purple-border); }
    .odd-pill.btts-no    { background: var(--gray-bg);   border-color: var(--gray-border); }

    .odds-loading {
      font-size: 0.72rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 4px;
    }
    .odds-updated {
      font-size: 0.68rem;
      color: #bbb;
      margin-top: 2px;
    }
    .odds-banner {
      max-width: 1100px;
      margin: 0 auto 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .odds-banner span { display: flex; align-items: center; gap: 6px; }
    .dot-live { width:8px; height:8px; border-radius:50%; background:#22c55e; display:inline-block; }
    .dot-stale{ width:8px; height:8px; border-radius:50%; background:#f59e0b; display:inline-block; }
    .btn-refresh {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      padding: 4px 12px;
      border: 1px solid var(--border2);
      border-radius: 6px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--text); }
    .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>

<div id="authScreen">

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((b, i) =>
    b.classList.toggle('active', (i === 0) === (tab === 'login'))
  );
  document.getElementById('loginForm').style.display    = tab === 'login'    ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('authError').textContent = '';
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  setAuthError('');
  if (!email || !password) return setAuthError('Completa todos los campos');
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const res  = await fetch(`${API_URL}/api/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');
    token = data.token; user = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    showApp();
  } catch(err) { setAuthError(err.message); }
  finally { btn.disabled = false; btn.textContent = 'Entrar'; }
}

async function register() {
  const username = document.getElementById('regUsername').value.trim();
  const email    = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  setAuthError('');
  if (!username || !email || !password) return setAuthError('Completa todos los campos');
  if (password.length < 8) return setAuthError('La contraseña debe tener al menos 8 caracteres');
  const btn = document.getElementById('btnRegister');
  btn.disabled = true; btn.textContent = 'Creando cuenta...';
  try {
    const res  = await fetch(`${API_URL}/api/auth/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, email, password}) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error al registrarse');
    token = data.token; user = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    showApp();
  } catch(err) { setAuthError(err.message); }
  finally { btn.disabled = false; btn.textContent = 'Crear cuenta'; }
}

function logout() {
  token = null; user = null; savedBets = {}; oddsData = {};
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  document.getElementById('appScreen').style.display  = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}

function setAuthError(msg) { document.getElementById('authError').textContent = msg; }

// ══════════════════════════════════════════════════════════════
async function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display  = 'block';
  document.getElementById('userBadge').textContent    = `👤 ${user.username}`;
  document.getElementById('oddsBanner').style.display = 'flex';

  const dates = [...new Set(matches.map(m => m.date))];
  const dateSelect = document.getElementById('filterDate');
  dateSelect.innerHTML = '<option value="">Todas</option>';
  dates.forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    dateSelect.appendChild(o);
  });

  document.getElementById('filterGroup').addEventListener('change', render);
  document.getElementById('filterDate').addEventListener('change', render);
  document.getElementById('searchTeam').addEventListener('input', render);

  await Promise.all([loadBets(), loadOdds()]);
  render();
}

// ══════════════════════════════════════════════════════════════
// ODDS
// ══════════════════════════════════════════════════════════════
async function loadOdds(forceRefresh = false) {
  const btn = document.getElementById('btnRefreshOdds');
  const status = document.getElementById('oddsStatus');
  const dot    = document.getElementById('oddsDot');
  btn.disabled = true;
  status.textContent = 'Cargando cuotas...';

  try {
    const url = forceRefresh ? `${API_URL}/api/odds?refresh=1` : `${API_URL}/api/odds`;
    const res  = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if (!res.ok) throw new Error('Error al cargar cuotas');
    const data = await res.json();

    oddsData = data.odds || {};

    const count     = Object.keys(oddsData).length;
    const fetchedAt = data.fetched_at ? new Date(data.fetched_at) : null;
    const timeStr   = fetchedAt ? fetchedAt.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit'}) : '—';
    const isLive    = data.source === 'api_fresh';

    dot.className   = isLive ? 'dot-live' : 'dot-stale';
    status.textContent = count > 0
      ? `${count} partidos con cuotas · actualizado ${timeStr}`
      : 'Cuotas no disponibles aún (el torneo aún no empezó)';

  } catch(err) {
    status.textContent = 'No se pudieron cargar las cuotas';
    dot.className = 'dot-stale';
  } finally {
    btn.disabled = false;
  }
}

  'Croacia': 'Croatia', 'Ghana': 'Ghana', 'Panamá': 'Panama',
  'Colombia': 'Colombia', 'Uzbekistán': 'Uzbekistan', 'España': 'Spain',
  'Cabo Verde': 'Cape Verde', 'Uruguay': 'Uruguay', 'Egipto': 'Egypt',
  'Turquía': 'Turkey', 'Paraguay': 'Paraguay', 'Australia': 'Australia',
  'Alemania': 'Germany', 'Curazao': 'Curaçao', 'Ecuador': 'Ecuador',
  'Suecia': 'Sweden', 'Túnez': 'Tunisia', 'Japón': 'Japan',
  'Haití': 'Haiti', 'Escocia': 'Scotland', 'Marruecos': 'Morocco',
  'Bosnia & Herz.': 'Bosnia & Herzegovina', 'Canadá': 'Canada',
  'Suiza': 'Switzerland', 'Sudáfrica': 'South Africa', 'Senegal': 'Senegal',
  'Irak': 'Iraq', 'Irlanda': 'Ireland',
};

// ── DESPUÉS (CORRECTO) ──────────────────────────────────────────
function findOdds(home, away) {
  // oddsData ya viene con nombres en español desde el backend
  for (const key of Object.keys(oddsData)) {
    const o = oddsData[key];
    if (o.home === home && o.away === away) return o;
    if (o.home === away && o.away === home) return o; // por si están invertidos
  }
  return null;
}

// ══════════════════════════════════════════════════════════════
// BETS
// ══════════════════════════════════════════════════════════════
async function loadBets() {
  try {
    const res  = await fetch(`${API_URL}/api/bets`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    savedBets = {};
    data.forEach(b => {
      savedBets[`${b.match_id}|${b.bet_type}`] = { id: b.id, amount: b.amount, prediction: b.prediction };
    });
  } catch(err) { console.error('Error cargando apuestas:', err); }
}

// ══════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════
function matchId(m) {
  return `${m.g}_${m.home}_${m.away}_${m.date}`.replace(/\s+/g,'').replace(/[^a-zA-Z0-9_áéíóúÁÉÍÓÚñÑ]/g,'');
}

function buildOddsRow(m) {
  const o = findOdds(m.home, m.away);
  if (!o) return '';

  const pills = [];
  if (o['1x2']?.home) pills.push(`<span class="odd-pill home-pill"><span class="odd-label">L</span><span class="odd-val">${o['1x2'].home.toFixed(2)}</span></span>`);
  if (o['1x2']?.draw) pills.push(`<span class="odd-pill draw-pill"><span class="odd-label">E</span><span class="odd-val">${o['1x2'].draw.toFixed(2)}</span></span>`);
  if (o['1x2']?.away) pills.push(`<span class="odd-pill away-pill"><span class="odd-label">V</span><span class="odd-val">${o['1x2'].away.toFixed(2)}</span></span>`);
  if (o.goals?.over25)  pills.push(`<span class="odd-pill over-pill"><span class="odd-label">+2.5</span><span class="odd-val">${o.goals.over25.toFixed(2)}</span></span>`);
  if (o.goals?.under25) pills.push(`<span class="odd-pill under-pill"><span class="odd-label">-2.5</span><span class="odd-val">${o.goals.under25.toFixed(2)}</span></span>`);
  if (o.btts?.yes) pills.push(`<span class="odd-pill btts-yes"><span class="odd-label">Ambos Sí</span><span class="odd-val">${o.btts.yes.toFixed(2)}</span></span>`);
  if (o.btts?.no)  pills.push(`<span class="odd-pill btts-no"><span class="odd-label">Ambos No</span><span class="odd-val">${o.btts.no.toFixed(2)}</span></span>`);

  if (!pills.length) return '';
  return `<div class="odds-row">${pills.join('')}</div>`;
}

function buildTags(m) {
  const mid = matchId(m);
  return BETS.map(b => {
    const key    = `${mid}|${b.label}`;
    const saved  = savedBets[key];
    const cls    = `tag ${b.cls}${saved ? ' saved' : ''}`;
    const title  = saved
      ? `Guardada: ${saved.prediction || '—'} · ${saved.amount ? '$'+saved.amount : 'sin monto'}`
      : 'Clic para registrar apuesta';
    return `<span class="${cls}" title="${title}" onclick="openModal(${JSON.stringify(m).replace(/"/g,"'")}, '${b.label}')">${b.label}</span>`;
  }).join('');
}

function render() {
  const gFilter = document.getElementById('filterGroup').value;
  const dFilter = document.getElementById('filterDate').value;
  const search  = document.getElementById('searchTeam').value.toLowerCase().trim();

  const filtered = matches.filter(m => {
    if (gFilter && m.g !== gFilter) return false;
    if (dFilter && m.date !== dFilter) return false;
    if (search && !m.home.toLowerCase().includes(search) && !m.away.toLowerCase().includes(search)) return false;
    return true;
  });

  const tbody   = document.getElementById('tableBody');
  const noRes   = document.getElementById('noResults');
  const countEl = document.getElementById('countLabel');

  if (!filtered.length) {
    tbody.innerHTML = ''; noRes.style.display = 'block'; countEl.textContent = ''; return;
  }
  noRes.style.display = 'none';
  countEl.textContent = `${filtered.length} partido${filtered.length!==1?'s':''} mostrado${filtered.length!==1?'s':''}`;

  tbody.innerHTML = filtered.map(m => `
    <tr>
      <td data-label="Gr."><span class="grp">${m.g}</span></td>
      <td data-label="Partido" class="match-name">${m.home} <span class="vs">vs</span> ${m.away}</td>
      <td data-label="Hora VET" class="time-cell">${m.time}<br><span class="date-sub">${m.date}</span></td>
      <td data-label="Sede" class="venue">${m.venue}</td>
      <td data-label="Apuestas">
        <div class="tags">${buildTags(m)}</div>
        ${buildOddsRow(m)}
      </td>
    </tr>
  `).join('');
}

// ══════════════════════════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════════════════════════
function openModal(m, betType) {
  modalMatch = m; modalBetType = betType;
  const mid      = matchId(m);
  const key      = `${mid}|${betType}`;
  const existing = savedBets[key];
  modalBetId     = existing ? existing.id : null;

  document.getElementById('modalTitle').textContent = `${betType} — ${m.home} vs ${m.away}`;
  document.getElementById('modalSub').textContent   = `${m.date} · ${m.time} VET · ${m.venue}`;
  document.getElementById('modalAmount').value      = existing?.amount || '';
  document.getElementById('modalPrediction').value  = existing?.prediction || '';
  document.getElementById('modalError').textContent = '';
  document.getElementById('btnDeleteBet').style.display = existing ? 'block' : 'none';

  // Mostrar cuotas relevantes en el modal
  const oddsInfo = document.getElementById('modalOddsInfo');
  const o = findOdds(m.home, m.away);
  if (o) {
    let infoHtml = '';
    if (betType === '1X2' && o['1x2'])
      infoHtml = `🏠 <b>${m.home}</b> ${o['1x2'].home?.toFixed(2) || '—'} &nbsp;·&nbsp; Empate ${o['1x2'].draw?.toFixed(2) || '—'} &nbsp;·&nbsp; ✈️ <b>${m.away}</b> ${o['1x2'].away?.toFixed(2) || '—'}`;
    else if (betType === 'Goles +/-' && o.goals)
      infoHtml = `⚽ Más de 2.5: <b>${o.goals.over25?.toFixed(2) || '—'}</b> &nbsp;·&nbsp; Menos de 2.5: <b>${o.goals.under25?.toFixed(2) || '—'}</b>`;
    else if (betType === 'Ambos anotan' && o.btts)
      infoHtml = `Ambos anotan Sí: <b>${o.btts.yes?.toFixed(2) || '—'}</b> &nbsp;·&nbsp; No: <b>${o.btts.no?.toFixed(2) || '—'}</b>`;

    if (infoHtml) {
      oddsInfo.innerHTML = `📊 Cuotas de referencia: ${infoHtml}`;
      oddsInfo.style.display = 'block';
    } else {
      oddsInfo.style.display = 'none';
    }
  } else {
    oddsInfo.style.display = 'none';
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  modalMatch = modalBetType = modalBetId = null;
}

async function saveBet() {
  const amount     = document.getElementById('modalAmount').value;
  const prediction = document.getElementById('modalPrediction').value.trim();
  document.getElementById('modalError').textContent = '';
  const mid = matchId(modalMatch);
  try {
    const res = await fetch(`${API_URL}/api/bets`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ match_id:mid, home:modalMatch.home, away:modalMatch.away, match_date:modalMatch.date, match_time:modalMatch.time, venue:modalMatch.venue, grupo:modalMatch.g, bet_type:modalBetType, amount: amount ? parseFloat(amount) : null, prediction: prediction || null }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error al guardar');
    savedBets[`${mid}|${modalBetType}`] = { id: data.id, amount: data.amount, prediction: data.prediction };
    closeModal(); render(); showToast('✓ Apuesta guardada');
  } catch(err) { document.getElementById('modalError').textContent = err.message; }
}

async function deleteBet() {
  if (!modalBetId) return;
  try {
    const res = await fetch(`${API_URL}/api/bets/${modalBetId}`, { method:'DELETE', headers:{'Authorization':`Bearer ${token}`} });
    if (!res.ok) throw new Error('Error al eliminar');
    const mid = matchId(modalMatch);
    delete savedBets[`${mid}|${modalBetType}`];
    closeModal(); render(); showToast('Apuesta eliminada');
  } catch(err) { document.getElementById('modalError').textContent = err.message; }
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
